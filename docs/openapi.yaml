openapi: 3.0.3
info:
  title: JobScout AI API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      responses:
        "200":
          description: OK
  /v1/profile:
    get:
      responses:
        "200":
          description: Candidate profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "404":
          description: Profile not configured
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfile"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
  /v1/search:
    post:
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Search summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchSummary"
  /v1/vacancies:
    get:
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: per_page
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Vacancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VacancyWithMatch"
  /v1/vacancies/recommended:
    get:
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: per_page
          schema:
            type: integer
      responses:
        "200":
          description: Recommended vacancies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VacancyWithMatch"
  /v1/vacancies/import-url:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualImportRequest"
      responses:
        "200":
          description: Imported vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyWithMatch"
        "422":
          description: Manual text required
  /v1/vacancies/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyWithMatch"
        "404":
          description: Not found
  /v1/vacancies/{id}/status:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
      responses:
        "200":
          description: Updated vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyWithMatch"
        "409":
          description: Invalid transition
  /v1/vacancies/{id}/applications/prepare:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareApplicationRequest"
      responses:
        "200":
          description: Existing application or prepared preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
        "201":
          description: Newly prepared application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
        "404":
          description: Not found
        "409":
          description: Conflict or invalid state
  /v1/resumes:
    get:
      responses:
        "200":
          description: Resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeCreateRequest"
      responses:
        "201":
          description: Created resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
  /v1/resumes/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: Not found
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumePatchRequest"
      responses:
        "200":
          description: Updated resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: Not found
  /v1/applications:
    get:
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationView"
  /v1/applications/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
        "404":
          description: Not found
  /v1/applications/{id}/approve:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
  /v1/applications/{id}/cancel:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
  /v1/applications/{id}/mark-submitted:
    post:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
  /v1/applications/{id}/outcome:
    patch:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationOutcomeRequest"
      responses:
        "200":
          description: Updated application outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationView"
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
    CandidateProfile:
      type: object
      properties:
        id: { type: string }
        desiredRoles:
          type: array
          items: { type: string }
        desiredGrades:
          type: array
          items: { type: string }
        primarySkills:
          type: array
          items: { type: string }
        secondarySkills:
          type: array
          items: { type: string }
        excludedSkills:
          type: array
          items: { type: string }
        desiredLocations:
          type: array
          items: { type: string }
        remoteAllowed: { type: boolean }
        relocationAllowed: { type: boolean }
        minimumSalary:
          type: integer
          nullable: true
        currencies:
          type: array
          items: { type: string }
        employmentTypes:
          type: array
          items: { type: string }
        excludedCompanies:
          type: array
          items: { type: string }
        stopWords:
          type: array
          items: { type: string }
        yearsOfCommercialExperience: { type: integer }
        languages:
          type: array
          items: { type: string }
        workAuthorization:
          type: array
          items: { type: string }
    SearchRequest:
      type: object
      properties:
        query: { type: string }
    SearchSummary:
      type: object
      properties:
        found: { type: integer }
        imported: { type: integer }
        duplicates: { type: integer }
        filtered: { type: integer }
        recommended: { type: integer }
        errors: { type: integer }
    ManualImportRequest:
      type: object
      required: [url]
      properties:
        url: { type: string }
        text: { type: string }
        title: { type: string }
        companyName: { type: string }
        location: { type: string }
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Company:
      type: object
      properties:
        id: { type: string }
        normalizedName: { type: string }
        displayName: { type: string }
        website: { type: string, nullable: true }
        careerPage: { type: string, nullable: true }
        blacklisted: { type: boolean }
        notes: { type: string, nullable: true }
    Vacancy:
      type: object
      properties:
        id: { type: string }
        sourceId: { type: string }
        externalId: { type: string }
        sourceUrl: { type: string }
        canonicalUrl: { type: string, nullable: true }
        title: { type: string }
        normalizedTitle: { type: string }
        companyId: { type: string }
        description: { type: string }
        requirements: { type: string }
        responsibilities: { type: string }
        location: { type: string }
        remoteType: { type: string }
        employmentType: { type: string }
        grade: { type: string }
        salaryFrom: { type: integer, nullable: true }
        salaryTo: { type: integer, nullable: true }
        currency: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
        languageRequirements:
          type: array
          items: { type: string }
        workAuthorizationRequirements:
          type: array
          items: { type: string }
        publishedAt: { type: string, format: date-time }
        collectedAt: { type: string, format: date-time }
        contentHash: { type: string }
        status: { type: string }
        duplicateOfVacancyId: { type: string, nullable: true }
        dedupReason: { type: string, nullable: true }
    ResumeTargetRole:
      type: string
      enum:
        - GO_BACKEND
        - PYTHON_BACKEND
        - SYSTEM_ANALYST
        - GENERAL_BACKEND
    ResumeLanguage:
      type: string
      enum:
        - RU
        - EN
    ApplicationMethod:
      type: string
      enum:
        - MANUAL_LINK
        - OFFICIAL_API
    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - WAITING_APPROVAL
        - APPROVED
        - MANUAL_ACTION_REQUIRED
        - SUBMITTED
        - CANCELLED
        - HR_CONTACT
        - INTERVIEW
        - OFFER
        - REJECTED
    ResumeCreateRequest:
      type: object
      required: [name, targetRole, language, textContent]
      properties:
        name: { type: string }
        targetRole:
          $ref: "#/components/schemas/ResumeTargetRole"
        language:
          $ref: "#/components/schemas/ResumeLanguage"
        textContent: { type: string }
        skills:
          type: array
          items: { type: string }
        isActive: { type: boolean, nullable: true }
    ResumePatchRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        targetRole:
          allOf:
            - $ref: "#/components/schemas/ResumeTargetRole"
          nullable: true
        language:
          allOf:
            - $ref: "#/components/schemas/ResumeLanguage"
          nullable: true
        textContent: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
          nullable: true
        isActive: { type: boolean, nullable: true }
    PrepareApplicationRequest:
      type: object
      properties:
        resumeId: { type: string, nullable: true }
    ApplicationOutcomeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        rejectionReason: { type: string }
        notes: { type: string }
    Resume:
      type: object
      properties:
        id: { type: string }
        candidateProfileId: { type: string }
        name: { type: string }
        targetRole:
          $ref: "#/components/schemas/ResumeTargetRole"
        language:
          $ref: "#/components/schemas/ResumeLanguage"
        textContent: { type: string }
        skills:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Application:
      type: object
      properties:
        id: { type: string }
        vacancyId: { type: string }
        candidateProfileId: { type: string }
        resumeId: { type: string }
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        applicationMethod:
          $ref: "#/components/schemas/ApplicationMethod"
        coverLetter: { type: string }
        preparedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time, nullable: true }
        responseReceivedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationView:
      type: object
      properties:
        application:
          $ref: "#/components/schemas/Application"
        resume:
          $ref: "#/components/schemas/Resume"
        vacancy:
          $ref: "#/components/schemas/Vacancy"
        company:
          $ref: "#/components/schemas/Company"
        match:
          $ref: "#/components/schemas/VacancyMatch"
        warnings:
          type: array
          items: { type: string }
        vacancyUrl: { type: string }
        created: { type: boolean }
    VacancyMatch:
      type: object
      properties:
        id: { type: string }
        vacancyId: { type: string }
        candidateProfileId: { type: string }
        totalScore: { type: integer }
        skillsScore: { type: integer }
        experienceScore: { type: integer }
        locationScore: { type: integer }
        salaryScore: { type: integer }
        gradeScore: { type: integer }
        roleScore: { type: integer }
        positiveReasons:
          type: array
          items: { type: string }
        negativeReasons:
          type: array
          items: { type: string }
        missingSkills:
          type: array
          items: { type: string }
        hardFilterPassed: { type: boolean }
        calculatedAt: { type: string, format: date-time }
        scoringVersion: { type: string }
    VacancyWithMatch:
      type: object
      properties:
        vacancy:
          $ref: "#/components/schemas/Vacancy"
        company:
          $ref: "#/components/schemas/Company"
        match:
          $ref: "#/components/schemas/VacancyMatch"
