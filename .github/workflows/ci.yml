name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Check format
        run: |
          if [ -n "$(gofmt -l $(git ls-files '*.go'))" ]; then
            echo "Go files are not formatted"
            gofmt -l $(git ls-files '*.go')
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

